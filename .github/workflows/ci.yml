name: CI

# Only runs on pull requests. Push-to-main is handled by release.yml, which
# runs the same lint / typecheck / test / build steps as part of the release
# pipeline. Two workflows fighting over the same checks on main was wasteful.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Node 24 is the build/release Node (see release.yml), so it carries the
    # full gate. The Node 22 job below is deliberately narrow — see its comment.
    name: Node 24
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:cov

      - run: npm run build

      # pack-smoke verifies the published tarball installs cleanly and every
      # documented public export resolves in both CJS and ESM — catches
      # publish-time-only regressions that the in-repo suite can't see
      # (missing files, broken `exports` map, ESM-resolution issues).
      - run: npm run pack:smoke

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: ./reports/junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The engines floor is >=22.12, and Node 22 bundles npm 10 while Node 24
  # bundles npm 11. The two disagree on trees with conflicting optional peer
  # deps, so a lockfile npm 11 accepts can still break `npm ci` on npm 10.
  node22:
    name: Node 22
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # The regression gate: fails if the committed lockfile is not installable
      # under npm 10. Everything else here is near-free once installed.
      - run: npm ci

      - run: npm test
